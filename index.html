<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BlinkSky prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Black screens, thin type, one colour per kind of object. The only bright thing is the object. */
  :root {
    --bk: #000; --wh: #f4f4f2; --g1: #8a8a8a; --g2: #4a4a4a; --hl: #262626; --panel: #0d0d0f;
    --belt: #c9b79c; --nea: #ff8a4c; --comet: #6fd3d6; --inter: #a990ff; --unl: #f4f4f2;
    --back: #1c1242; --lav: #c9bdf0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: #0a0a0c; color: var(--wh); font-family: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif; font-weight: 400;
    display: flex; justify-content: center; align-items: center; }
  button { font-family: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--wh); outline-offset: 2px; }
  .app { width: 100%; max-width: 430px; height: 100%; max-height: 900px; position: relative; overflow: hidden; overflow: clip; background: var(--bk); }
  @media (min-width: 600px) { .app { border-radius: 40px; border: 10px solid #1a1a1c; height: 92vh; } }
  .screen { display: none; position: absolute; inset: 0; flex-direction: column; }
  .screen.on { display: flex; }

  /* shared bits */
  .loc { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 20px 0; font-size: 12px; line-height: 1.35; position: relative; z-index: 1; }
  .loc b { display: block; font-weight: 600; }
  .loc span { color: var(--g1); }
  .x { font-size: 18px; width: 36px; height: 36px; margin: -8px 0 0 -8px; }
  .h1 { font-weight: 300; font-size: 40px; line-height: 1.02; letter-spacing: -.03em; padding: 0 20px; }
  .startbtn { display: block; margin: 16px 20px 0; background: var(--wh); color: var(--bk); text-align: center; padding: 15px; border-radius: 999px; font-size: 16px; font-weight: 600; width: calc(100% - 40px); }
  .startbtn:active, .ghostbtn:active { transform: scale(.98); }
  .ghostbtn { display: flex; justify-content: center; align-items: baseline; gap: 8px; margin: 10px 20px 0; border: 1px solid #3a3a3a; text-align: center; padding: 13px; border-radius: 999px; font-size: 14px; font-weight: 500; width: calc(100% - 40px); }
  .ghostbtn small { color: var(--g1); font-size: 12px; font-weight: 400; }
  .note { font-size: 11px; line-height: 1.45; color: #6f6f6f; padding: 14px 20px 18px; }

  /* home */
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .homefade { position: absolute; inset: 0; background: linear-gradient(transparent 35%, rgba(0,0,0,.9) 62%, #000 75%); pointer-events: none; }
  .homebody { margin-top: auto; position: relative; z-index: 1; }
  .decklink { display: block; margin: 14px auto 0; font-size: 13px; color: var(--wh); }
  .decklink span { color: var(--g1); }

  /* play */
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #sky.dragging { cursor: grabbing; }
  .vf { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,.7) 100%); }
  .hud { position: absolute; left: 14px; right: 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .hud.top { top: 14px; } .hud.bottom { bottom: 18px; }
  .pill { background: rgba(10,10,12,.82); backdrop-filter: blur(6px); border: 1px solid #2c2c2c; border-radius: 999px; padding: 10px 18px; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .pill.icon { width: 42px; height: 42px; padding: 0; justify-content: center; font-size: 16px; }
  .frames { display: flex; gap: 4px; }
  .frames span { padding: 4px 9px; border-radius: 999px; font-size: 11px; color: var(--g1); }
  .frames span.on { background: var(--wh); color: var(--bk); }
  #mini { position: absolute; right: 14px; bottom: 74px; width: 76px; height: 76px; border-radius: 10px; background: rgba(10,10,12,.82); border: 1px solid #2c2c2c; pointer-events: none; }
  .realtag { position: absolute; left: 14px; right: 14px; top: 66px; text-align: center; pointer-events: none; font-size: 11px; color: var(--g1); text-shadow: 0 1px 4px #000; }
  .toast { position: absolute; left: 50%; bottom: 76px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 120px); text-align: center; pointer-events: none;
    background: rgba(10,10,12,.9); border: 1px solid #2c2c2c; border-radius: 16px; padding: 9px 16px; font-size: 13px; transition: opacity .3s; }
  .lock { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; pointer-events: none; border: 2px solid var(--wh); animation: lock .45s ease-out forwards; }
  @keyframes lock { from { transform: scale(2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* cards: black metal front, flat purple back */
  .tc { --w: 220px; --c: var(--belt); width: var(--w); aspect-ratio: 63 / 88; font-size: calc(var(--w) * .05); border-radius: .75em; padding: .5em; display: flex; flex-direction: column; position: relative; flex: none;
    background: linear-gradient(160deg, #1b1b1b, #0a0a0a 45%, #050505); border: 1px solid #3c3c3c; border-top-color: #6a6a6a;
    box-shadow: 0 1.2em 2em rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.08); user-select: none; -webkit-user-select: none; }
  .tc-top { display: flex; justify-content: space-between; align-items: center; font-size: .72em; color: var(--g1); letter-spacing: .06em; padding: 0 .2em .45em; }
  .kd { display: flex; align-items: center; gap: .35em; color: var(--wh); }
  .kd i { width: .55em; height: .55em; border-radius: 50%; background: var(--c); }
  .tc-win { position: relative; border-radius: .45em; overflow: hidden; border: 1px solid #2c2c2c; aspect-ratio: 38 / 26; flex: none; background: #050505; display: grid; place-items: center; }
  .tc-win img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tc-win > svg { width: 62%; height: 80%; }
  .ring { position: absolute; left: 50%; top: 50%; width: 1.6em; height: 1.6em; border: 2px solid var(--c); border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 3px rgba(0,0,0,.45); }
  .tc-name { font-size: 1.55em; font-weight: 300; letter-spacing: -.03em; line-height: 1.05; margin: .45em .1em 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tc-type { font-size: .62em; letter-spacing: .1em; text-transform: uppercase; color: var(--c); margin: .35em .15em 0; font-weight: 600; }
  .tc-rows { margin: .5em .15em 0; border-top: 1px solid var(--hl); font-size: .68em; line-height: 1.25; }
  .tc-rows div { display: flex; justify-content: space-between; gap: .5em; padding: .3em 0; border-bottom: 1px solid var(--hl); }
  .tc-rows span { color: var(--g1); white-space: nowrap; }
  .tc-rows b { font-weight: 400; text-align: right; }
  .tc-foot { margin-top: auto; padding-top: .4em; display: flex; justify-content: space-between; font-size: .56em; color: var(--g1); padding-inline: .15em; }
  .tc.back { padding: 0; background: var(--back); border-color: #2c2350; overflow: hidden; box-shadow: 0 1.2em 2em rgba(0,0,0,.9); }
  .tc.back svg { width: 100%; height: 100%; display: block; }

  /* caught */
  .stage { flex: 1; display: grid; place-items: center; min-height: 0; background: radial-gradient(60% 40% at 50% 48%, color-mix(in srgb, var(--c) 16%, transparent), transparent 70%); }
  #caughtCard .tc { transform: rotate(-2deg); animation: drop .5s cubic-bezier(.2,.9,.3,1.1); cursor: pointer; }
  @keyframes drop { from { transform: translateY(-30px) rotate(-6deg); opacity: 0; } }
  .caughtmsg { text-align: center; font-size: 13px; padding: 0 20px; }
  .caughtmsg b { display: block; font-weight: 500; font-size: 15px; }
  .caughtmsg span { color: var(--g1); font-size: 12px; }
  .btnrow { display: flex; gap: 10px; padding: 0 20px 22px; }
  .btnrow .startbtn, .btnrow .ghostbtn { margin: 14px 0 0; width: auto; flex: 1; padding: 15px; font-size: 15px; align-items: center; }

  /* deck */
  .deckhead { padding: 0 20px; }
  .deckhead .h1 { padding: 0; font-size: 32px; margin-top: 10px; }
  .stack { position: relative; flex: 1; min-height: 0; touch-action: pan-y; }
  .slot { position: absolute; left: 50%; top: 50%; transition: transform .35s cubic-bezier(.2,.9,.3,1.1), opacity .3s; will-change: transform; }
  .slot .tc { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); }
  .slot.top { cursor: grab; } .slot.drag { transition: none; cursor: grabbing; }
  .slot:not(.top) .fr, .slot.locked .fr { display: none; }
  .slot.top:not(.locked) .bk { display: none; }
  .slot:not(.top) .tc { filter: brightness(.6); }
  .kinds5 { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 6px 20px 0; }
  .kinds5 button { width: 11px; height: 11px; border-radius: 50%; border: 1px dashed #5a5a5a; padding: 0; }
  .kinds5 button.got { background: var(--c); border: 0; }
  .kinds5 button.cur { outline: 1px solid var(--wh); outline-offset: 3px; }
  .kinds5 span { margin-left: 6px; font-size: 12px; color: var(--g1); }
  .caption { text-align: center; padding: 6px 20px 0; font-size: 12px; color: var(--g1); min-height: 22px; }
  .caption b { color: var(--wh); font-weight: 500; }
  .stackctl { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 8px 0 20px; }
  .arrow { width: 42px; height: 42px; border-radius: 50%; border: 1px solid #3a3a3a; font-size: 18px; }
  .stackctl .pos { font-size: 13px; color: var(--g1); min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }

  /* details sheet */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 20; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 78%; overflow-y: auto; background: var(--panel); border-top: 1px solid #2c2c2c; border-radius: 22px 22px 0 0;
    padding: 10px 22px 26px; transform: translateY(105%); visibility: hidden; transition: transform .35s cubic-bezier(.2,.9,.3,1), visibility 0s .35s; z-index: 21; }
  .sheet-open .scrim { opacity: 1; pointer-events: auto; }
  .sheet-open .sheet { transform: none; visibility: visible; transition: transform .35s cubic-bezier(.2,.9,.3,1); }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: #3a3a3a; margin: 0 auto 14px; }
  .sh-head { display: flex; gap: 14px; align-items: center; }
  .sh-art { width: 72px; height: 72px; border-radius: 14px; background: #050505; border: 1px solid #2c2c2c; display: grid; place-items: center; flex: none; }
  .sh-art svg { width: 80%; height: 80%; }
  .sh-head h2 { font-weight: 300; font-size: 28px; letter-spacing: -.03em; line-height: 1.05; }
  .sh-head small { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--c); font-weight: 600; margin-top: 4px; }
  .sh-photo { margin-top: 16px; border-radius: 14px; overflow: hidden; border: 1px solid #2c2c2c; }
  .sh-photo img { width: 100%; display: block; }
  .sh-photo figcaption { font-size: 11px; color: var(--g1); padding: 8px 10px; }
  .sh-rows { margin-top: 16px; border-top: 1px solid var(--hl); font-size: 14px; }
  .sh-rows div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hl); }
  .sh-rows span { color: var(--g1); }
  .sh-rows b { font-weight: 400; text-align: right; }
  .sh-src { margin-top: 14px; font-size: 11px; color: var(--g1); line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fd3d6" stop-opacity=".9"/><stop offset="1" stop-color="#6fd3d6" stop-opacity="0"/></linearGradient>
    <linearGradient id="tail2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a990ff" stop-opacity=".6"/><stop offset="1" stop-color="#a990ff" stop-opacity="0"/></linearGradient>
  </defs>
  <symbol id="k-common" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="url(#glow)"/>
    <path d="M22 46C20 30 36 20 52 22C70 20 82 34 79 50C82 66 68 80 50 78C32 80 20 64 22 46Z" fill="#c9b79c"/>
    <path d="M50 78C68 80 82 66 79 50C76 62 62 72 46 70C36 70 28 66 24 60C30 72 40 79 50 78Z" fill="#8e7b62"/>
    <path d="M30 36C36 28 46 25 54 26C44 28 36 33 32 42Z" fill="#efe2cb"/>
    <circle cx="57" cy="41" r="5.5" fill="#a8957a"/><circle cx="37.5" cy="55.5" r="4" fill="#a8957a"/><circle cx="64" cy="61" r="3" fill="#8e7b62"/>
  </symbol>
  <symbol id="k-uncommon" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="url(#glow)"/>
    <ellipse cx="50" cy="50" rx="46" ry="16" fill="none" stroke="#ff8a4c" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="3 4" transform="rotate(-18 50 50)"/>
    <path d="M24 52C22 40 32 33 42 37C47 39 52 39 57 35C68 28 82 36 79 50C77 62 64 66 56 62C51 60 47 60 42 64C33 70 25 62 24 52Z" fill="#ff8a4c"/>
    <path d="M42 64C33 70 25 62 24 52C30 60 38 60 44 56C50 53 56 58 64 58C72 58 77 54 79 50C77 62 64 66 56 62C51 60 47 60 42 64Z" fill="#b8552a"/>
    <path d="M30 42C34 36 40 35 44 38C38 38 34 41 31 46Z" fill="#ffc29c"/>
    <circle cx="66" cy="45" r="4.5" fill="#d96a35"/><circle cx="36" cy="50" r="3.2" fill="#d96a35"/>
  </symbol>
  <symbol id="k-rare" viewBox="0 0 100 100">
    <path d="M66 30L8 92L14 96Z" fill="url(#tail)" opacity=".6"/><path d="M62 28L4 80L20 94L70 38Z" fill="url(#tail)" opacity=".35"/>
    <circle cx="68" cy="32" r="22" fill="url(#glow)"/><circle cx="68" cy="32" r="12" fill="#6fd3d6" opacity=".45"/>
    <circle cx="68" cy="32" r="7" fill="#c9f3f4"/><circle cx="66" cy="30" r="3" fill="#fff"/>
  </symbol>
  <symbol id="k-legendary" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="url(#glow)"/><path d="M70 34L10 86L22 92Z" fill="url(#tail2)" opacity=".5"/>
    <ellipse cx="62" cy="40" rx="20" ry="6.5" fill="#a990ff" transform="rotate(-38 62 40)"/>
    <ellipse cx="64" cy="42" rx="18" ry="3.2" fill="#6f55c9" transform="rotate(-38 64 42)"/>
    <ellipse cx="58" cy="37" rx="9" ry="2" fill="#d9ceff" transform="rotate(-38 58 37)"/>
  </symbol>
  <symbol id="k-unique" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="26" fill="none" stroke="#f4f4f2" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="4 5"/>
    <path d="M50 16V28M50 72V84M16 50H28M72 50H84" stroke="#f4f4f2" stroke-width="1.4"/><circle cx="50" cy="50" r="4" fill="#f4f4f2"/>
  </symbol>
</svg>

<div class="app" id="app">
  <section class="screen on" id="home">
    <canvas id="bg"></canvas>
    <div class="homefade"></div>
    <div class="loc"><div><b id="today">TONIGHT</b><span>Dhaka, Bangladesh</span></div></div>
    <div class="homebody">
      <h1 class="h1">Tonight's sky</h1>
      <button class="startbtn" data-go="hunt">Start hunting</button>
      <button class="ghostbtn" id="realBtn">Real NASA sky <small id="realSub">SPHEREx photos</small></button>
      <button class="decklink" data-go="collection">Your deck <span id="deckCount">0/5</span> →</button>
      <p class="note">Prototype. Practice skies are generated samples. "Real NASA sky" uses real SPHEREx photos (NASA/IPAC IRSA), checked against NASA JPL's list of known objects.</p>
    </div>
  </section>

  <section class="screen" id="play">
    <canvas id="sky"></canvas>
    <div class="vf"></div>
    <canvas id="mini" width="152" height="152"></canvas>
    <div class="hud top">
      <button class="pill icon" id="exit" aria-label="Leave">✕</button>
      <div class="pill" style="padding:4px"><div class="frames" id="frames"></div></div>
    </div>
    <div class="realtag" id="realTag" hidden></div>
    <div class="toast" id="toast">Tap what moves</div>
    <div class="hud bottom">
      <button class="pill" id="pause">❚❚ Pause</button>
      <div style="display:flex;gap:8px"><button class="pill" id="known" hidden>Show NASA's list</button><button class="pill" id="hint">Hint</button></div>
    </div>
  </section>

  <section class="screen" id="caught">
    <div class="loc"><button class="x" data-go="home" aria-label="Close">✕</button></div>
    <div class="stage" id="stage"><div id="caughtCard"></div></div>
    <div class="caughtmsg"><b id="caughtTitle">Caught</b><span>Tap the card for details</span></div>
    <div class="btnrow"><button class="startbtn" id="again">Hunt again</button><button class="ghostbtn" data-go="collection">Your deck</button></div>
  </section>

  <section class="screen" id="collection">
    <div class="loc"><button class="x" data-go="home" aria-label="Back">←</button></div>
    <div class="deckhead"><h1 class="h1">Your deck</h1></div>
    <div class="stack" id="deck"></div>
    <div class="kinds5" id="kinds5"></div>
    <div class="caption" id="caption"></div>
    <div class="stackctl"><button class="arrow" id="prevCard" aria-label="Previous card">‹</button><span class="pos" id="stackPos"></span><button class="arrow" id="nextCard" aria-label="Next card">›</button></div>
  </section>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Card details"></div>
</div>

<script>
/* ---------- data ---------- */
// Sample facts, labelled as sample data in the UI. "How often" figures are rough shares of known objects.
const KINDS = {
  common:    { name: 'Main-belt asteroid', short: 'Main belt', color: '#c9b79c',
               facts: [['Size', 'about 2 km across'], ['How often', 'most movers you will see'], ['Lives', 'between Mars and Jupiter']] },
  uncommon:  { name: 'Near-Earth asteroid', short: 'Near-Earth', color: '#ff8a4c',
               facts: [['Size', 'about 3 football fields'], ['How often', 'about 1 in 40 known asteroids'], ['Orbit', "crosses Earth's path"]] },
  rare:      { name: 'Comet', short: 'Comet', color: '#6fd3d6',
               facts: [['Made of', 'ice and dust'], ['How often', 'about 1 in 350 known objects'], ['Tail', 'grows near the Sun']] },
  legendary: { name: 'Interstellar visitor', short: 'Interstellar', color: '#a990ff',
               facts: [['From', 'another star'], ['How often', '3 ever seen'], ['Speed', 'too fast for the Sun to hold']] },
  unique:    { name: 'Not on any list', short: 'Unlisted', color: '#f4f4f2',
               facts: [['Status', 'no match in NASA JPL list'], ['How often', 'very rare'], ['Next', 'sent to experts to check']] },
};
const ORDER = ['common', 'uncommon', 'rare', 'legendary', 'unique'];
const SCRIPT = ['common', 'uncommon', 'common', 'rare', 'legendary', 'unique'];
const WEIGHTS = [['common', 55], ['uncommon', 25], ['rare', 12], ['legendary', 5], ['unique', 3]];
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

// Uniform card back: flat purple, line doodles of things you can catch, the name top and bottom like a playing card.
const BACK_SVG = `<svg viewBox="0 0 630 880"><rect width="630" height="880" fill="#1c1242"/>
  <g fill="#e6dcff" fill-opacity=".55">${(() => { const r = rng(3); let s = ''; for (let i = 0; i < 110; i++) { const m = Math.pow(r(), 4); s += `<circle cx="${(30 + r() * 570).toFixed(0)}" cy="${(30 + r() * 820).toFixed(0)}" r="${(1 + m * 3).toFixed(1)}"/>`; } return s; })()}</g>
  <rect x="22" y="22" width="586" height="836" rx="22" fill="none" stroke="#e6dcff" stroke-opacity=".3" stroke-width="2"/>
  <g fill="none" stroke="#c9bdf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
    <path d="M120 150c-8-30 22-48 46-40 28-8 50 14 42 40 8 26-20 46-44 38-26 8-52-12-44-38z"/><circle cx="150" cy="140" r="8"/><circle cx="178" cy="168" r="5"/>
    <circle cx="470" cy="190" r="12"/><path d="M462 199L380 268M470 203L398 280M455 193L372 252"/>
    <path d="M450 590c-6-22 16-36 34-30 20-6 38 10 32 30 6 20-14 34-32 28-20 6-38-8-34-28z"/><circle cx="472" cy="584" r="6"/>
    <path d="M130 640c-6-18 12-30 28-26 18-4 32 10 26 26 4 16-12 28-28 24-16 4-30-8-26-24z"/><circle cx="148" cy="636" r="4"/>
    <path d="M300 250l8-22 8 22 22 8-22 8-8 22-8-22-22-8z"/><path d="M520 420l5-14 5 14 14 5-14 5-5 14-5-14-14-5z"/><path d="M95 400l5-14 5 14 14 5-14 5-5 14-5-14-14-5z"/>
    <path d="M300 720h22M311 709v22M220 330h16M228 322v16M560 300h14M567 293v14M70 780h14M77 773v14"/>

  const k = round.kind, first = !col[k];
  col[k] = (col[k] || 0) + 1; photos[k] = { img: shot, date: today(), hint: hintOn }; save(); roundNo++;
  presentCard(sampleCard(k), k === 'unique' ? 'Not on any list. Sent to experts.' : first ? `First ${KINDS[k].short} in your deck` : 'Caught');
}
$('again').onclick = () => round && round.real ? loadReal() : newRound();

/* ---------- the deck: a pile you swipe cards off ---------- */
let deckItems = [], order = [], dragMoved = false;
const TILT = [-4, 3.5, -2.5, 4.5, -3.5, 2.5];
function cardW() { return Math.round(Math.min(230, innerWidth * .6, (Math.min(innerHeight, 900) - 330) * .716)); }
function renderCollection() {
  const w = cardW();
  deckItems = [...ORDER.map(k => ({ c: sampleCard(k), k })), ...reals.map((r, i) => ({ c: realCard(r, i), k: r.comet ? 'rare' : 'common', real: true }))];
  $('deck').innerHTML = deckItems.map(d => `<div class="slot${d.c.locked ? ' locked' : ''}"><div class="fr">${d.c.locked ? '' : cardFront(d.c, w)}</div><div class="bk">${cardBack(w)}</div></div>`).join('');
  const found = ORDER.filter(k => col[k]).length;
  $('kinds5').innerHTML = ORDER.map(k => `<button class="${col[k] ? 'got' : ''}" style="--c:${KINDS[k].color}" aria-label="${KINDS[k].short}"></button>`).join('') + `<span>${found} of 5 kinds${reals.length ? ` · ${reals.length} real` : ''}</span>`;
  order = deckItems.map((_, i) => i).sort((a, b) => (deckItems[a].c.locked - deckItems[b].c.locked) || a - b);
  [...$('deck').children].forEach((slot, i) => {
    slot.onclick = () => { if (!dragMoved && slot.classList.contains('top') && !deckItems[i].c.locked) openSheet(deckItems[i].c); };
    wireDrag(slot);
  });
  [...$('kinds5').querySelectorAll('button')].forEach((b, i) => b.onclick = () => jumpTo(i));
  show('collection'); layoutStack();
}
function layoutStack() {
  const slots = $('deck').children;
  order.forEach((idx, depth) => {
    const s = slots[idx], d = Math.min(depth, 3), t = TILT[idx % TILT.length];
    s.classList.toggle('top', depth === 0);
    s.style.zIndex = 100 - depth;
    s.style.opacity = depth > 3 ? 0 : 1;
    s.style.transform = depth === 0 ? 'rotate(-1.5deg)' : `translate(${t * 5}px, ${-d * 6}px) rotate(${(t * (1.6 + d)).toFixed(1)}deg)`;
  });
  const it = deckItems[order[0]]; if (!it) return;
  $('caption').innerHTML = it.c.locked ? `${KINDS[it.k].short} · <b>not found yet</b>` : `<b>${it.c.name}</b> · tap for details · swipe for next`;
  $('stackPos').textContent = `${order[0] + 1} / ${deckItems.length}`;
  [...$('kinds5').querySelectorAll('button')].forEach((b, j) => b.classList.toggle('cur', j === order[0]));
}
function nextCard(dir = 1) {
  const s = $('deck').children[order[0]]; if (!s || order.length < 2) return;
  s.classList.remove('drag');
  s.style.transform = `translateX(${dir * 420}px) translateY(-30px) rotate(${dir * 28}deg)`;
  setTimeout(() => { order.push(order.shift()); s.style.zIndex = 0; layoutStack(); }, 230);
}
function prevCard() {
  if (order.length < 2) return;
  const idx = order.pop(), s = $('deck').children[idx];
  s.style.transition = 'none'; s.style.zIndex = 101; s.style.opacity = 1;
  s.style.transform = 'translateX(-420px) translateY(-30px) rotate(-28deg)';
  void s.offsetWidth; s.style.transition = '';
  order.unshift(idx); layoutStack();
}
function jumpTo(i) {
  if (order[0] === i) return;
  const s = $('deck').children[order[0]];
  s.style.transform = 'translateX(420px) rotate(28deg)';
  setTimeout(() => { while (order[0] !== i) order.push(order.shift()); layoutStack(); }, 200);
}
function wireDrag(slot) {
  let x0 = null, y0 = 0, dx = 0;
  slot.addEventListener('pointerdown', e => { if (!slot.classList.contains('top')) return; x0 = e.clientX; y0 = e.clientY; dx = 0; dragMoved = false; });
  slot.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = e.clientX - x0; const dy = e.clientY - y0;
    if (!dragMoved && Math.abs(dx) > 8) { dragMoved = true; slot.classList.add('drag'); slot.setPointerCapture(e.pointerId); }
    if (dragMoved) slot.style.transform = `translate(${dx}px, ${dy * .25}px) rotate(${dx * .08}deg)`;
  });
  const end = () => {
    if (x0 === null) return; x0 = null; slot.classList.remove('drag');
    if (dragMoved && Math.abs(dx) > 80) nextCard(Math.sign(dx)); else layoutStack();
    setTimeout(() => dragMoved = false, 0);
  };
  slot.addEventListener('pointerup', end); slot.addEventListener('pointercancel', end);
}
$('nextCard').onclick = () => nextCard(1);
$('prevCard').onclick = prevCard;
addEventListener('keydown', e => { if (!$('collection').classList.contains('on')) return; if (e.key === 'ArrowRight') nextCard(1); if (e.key === 'ArrowLeft') prevCard(); });

$('exit').onclick = () => show('home');
$('realBtn').onclick = loadReal;
$('known').onclick = () => { showKnown = !showKnown; if (showKnown) listUsed = true; $('known').textContent = showKnown ? "Hide NASA's list" : "Show NASA's list"; render(); };
$('hint').onclick = () => { if (!round.hintArea) return; hintOn = true; render(); toast('Look inside the circle'); };
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? '▶ Play' : '❚❚ Pause'; paused ? clearInterval(timer) : startBlink(); };
addEventListener('resize', () => { if ($('play').classList.contains('on')) { fit(); clampView(); render(); } });

show('home');

// Direct links for demos and recordings: #play, #real, #caught=<kind>, #collection, #full (fills the collection).
(function () {
  const h = location.hash.slice(1);
  if (h === 'full') ORDER.forEach(k => col[k] = col[k] || 1);
  if (h === 'play') newRound();
  else if (h === 'real') loadReal();
  else if (h.startsWith('caught=') && KINDS[h.slice(7)]) { round = makeRound(h.slice(7)); frame = 0; caught(snapshot(...round.path[0])); }
  else if (h === 'collection' || h === 'full') renderCollection();
})();
</script>
